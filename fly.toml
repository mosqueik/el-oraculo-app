# fly.toml app configuration file generated for el-oraculo-backend-frosty-haze-7294 on 2026-09-04T11:48:49-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'el-oraculo-backend-frosty-haze-7294'
primary_region = 'gru'

[build]
  dockerfile = 'backend/Dockerfile'

[env]
  CORS_ORIGIN = '*'
  DB_PATH = '/data/oraculo.db'
  NODE_ENV = 'production'
  PORT = '3001'

[[mounts]]
  source = 'oraculo_data'
  destination = '/data'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '15s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512

# ═══════════════════════════════════════════════════════════════════
# EL ORÁCULO — Docker Compose
# ═══════════════════════════════════════════════════════════════════

services:
  # ─── Backend (Node.js Trading Engine) ──────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: oraculo-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/app/data/oraculo.db
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - oraculo-data:/data
      - oraculo-logs:/app/backend/logs
    networks:
      - oraculo-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ─── Nginx (Reverse Proxy + SSL) ──────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: oraculo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - oraculo-certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - oraculo-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

# ─── Volumes ─────────────────────────────────────────────────────
volumes:
  oraculo-data:
    driver: local
  oraculo-logs:
    driver: local
  oraculo-certs:
    driver: local

# ─── Fly.io Config ────────────────────────────────────────────
# fly.toml is the main config for Fly.io deployment
# Run: ./scripts/fly-deploy.sh

# ─── Networks ────────────────────────────────────────────────────
networks:
  oraculo-network:
    driver: bridge
